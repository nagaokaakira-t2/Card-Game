<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- index.html 自体がブラウザ/CDNにキャッシュされて古いまま表示され続けるのを防ぐ -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>カードゲーム(仮)</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
  <style>
    .hidden { display: none !important; }
    body { background:#14161b; color:#e8e6df; font-family: sans-serif; }
    #fatal-error {
      display: none; background:#3a1f1f; color:#ffb3b3; padding:12px 16px;
      margin: 12px; border-radius:8px; font-size:13px; white-space:pre-wrap;
    }
  </style>
</head>
<body>
  <div id="fatal-error"></div>

  <div id="mode-select">
    <h2>カードゲーム(仮)</h2>
    <p>対戦相手を選んでください</p>
    <div class="mode-buttons">
      <button class="mode-btn" data-level="cpu">
        CPU対戦(かんたん)
        <small>ランダムにカードを出し、手当たり次第に攻撃してくる相手です。</small>
      </button>
      <button class="mode-btn" data-level="ai">
        AI対戦(強め)
        <small>手札を効率よく使い、有利な属性やとどめを狙って攻撃してくる相手です。</small>
      </button>
    </div>
    <p id="boot-status" style="margin-top:20px;font-size:11px;color:#666;"></p>
  </div>

  <div id="builder-screen" class="hidden">
    <header>
      <h1>デッキ&能力の編集</h1>
      <button id="quick-start-btn" class="secondary-btn">おまかせでそのまま開始</button>
    </header>
    <main>
      <section class="zone">
        <div class="builder-tabs">
          <button class="tab-btn active" data-tab="deck">デッキ編集</button>
          <button class="tab-btn" data-tab="abilities">能力編集</button>
        </div>

        <div id="deck-tab" class="tab-panel">
          <div class="builder-toolbar">
            <span>デッキ: <b id="deck-count-display">0</b> / 50</span>
            <div>
              <button id="deck-random-fill-btn" class="secondary-btn">AIにおまかせで残りを埋める</button>
              <button id="deck-default-btn" class="secondary-btn">デフォルトデッキ(全ランダム)</button>
              <button id="deck-reset-btn" class="secondary-btn">リセット</button>
            </div>
          </div>
          <!-- 属性ごとに列を分け、各列の中でクリーチャー/特殊効果もさらに分けて表示 -->
          <div id="card-pool" class="card-pool-columns"></div>
        </div>

        <div id="abilities-tab" class="tab-panel hidden">
          <div class="builder-toolbar">
            <span>能力コスト: <b id="ability-cost-display">0</b> / 13</span>
            <div>
              <button id="ability-random-fill-btn" class="secondary-btn">AIにおまかせで残りを埋める</button>
              <button id="ability-default-btn" class="secondary-btn">デフォルト構成(全ランダム)</button>
              <button id="ability-reset-btn" class="secondary-btn">リセット</button>
            </div>
          </div>
          <div id="ability-pool" class="ability-pool"></div>
        </div>
      </section>

      <div class="controls">
        <button id="back-to-mode-btn" class="secondary-btn">相手選択に戻る</button>
        <button id="confirm-start-btn" disabled>この内容で対戦開始(デッキ50枚必要)</button>
      </div>
    </main>
  </div>

  <div id="game-screen" class="hidden">
    <header>
      <h1>カードゲーム(仮) - 試作版</h1>
      <div id="turn-indicator"></div>
    </header>

    <div id="action-banner" class="action-banner"></div>

    <main>
      <!-- 簡易盤面: 手札とは別に、HPや光を一目で確認できるパネル -->
      <section class="board-panel">
        <div class="board-row">
          <span class="board-label">相手</span>
          <div class="hp-bar-outer"><div class="hp-bar-inner" id="opponent-hp-bar"></div></div>
          <span class="board-stat">HP <b id="opponent-hp"></b>/<span id="opponent-maxhp"></span></span>
          <span class="board-stat">光 <b id="opponent-light"></b></span>
          <span class="board-stat">山札 <b id="deck-count-opponent"></b></span>
          <span class="board-stat">場 <b id="opponent-field-count"></b>/5</span>
          <span class="player-target" id="opponent-player-target">プレイヤーを攻撃</span>
        </div>
        <div class="board-row">
          <span class="board-label">自分</span>
          <div class="hp-bar-outer"><div class="hp-bar-inner self" id="self-hp-bar"></div></div>
          <span class="board-stat">HP <b id="self-hp"></b>/<span id="self-maxhp"></span></span>
          <span class="board-stat">光 <b id="self-light"></b></span>
          <span class="board-stat">山札 <b id="deck-count-self"></b></span>
          <span class="board-stat">場 <b id="self-field-count"></b>/5</span>
          <span class="board-stat">手札 <b id="self-hand-count"></b></span>
        </div>
      </section>

      <section class="zone">
        <div class="zone-header"><span>相手の場</span></div>
        <div class="field" id="opponent-field"></div>
      </section>

      <section class="zone">
        <div class="zone-header"><span>自分の場</span></div>
        <div class="field" id="player-field"></div>
      </section>

      <!-- 選択中のカード/クリーチャーの詳細と、実行するかどうかの確認 -->
      <section class="zone selection-panel" id="selection-panel">
        <div class="zone-header"><span>選択中</span></div>
        <div id="selection-content" class="selection-content">
          <p class="selection-hint">手札のカード、または自分の場のクリーチャーを選んでください。</p>
        </div>
      </section>

      <section class="zone">
        <div class="zone-header"><span>自分の手札</span></div>
        <div class="hand" id="player-hand"></div>
      </section>

      <section class="zone">
        <div class="zone-header"><span>自分のプレイヤー能力</span></div>
        <div class="abilities" id="self-abilities"></div>
      </section>

      <section class="zone">
        <div class="zone-header"><span>ログ</span></div>
        <div id="log"></div>
      </section>

      <div class="controls">
        <button id="end-turn-btn">ターン終了</button>
      </div>
    </main>
  </div>

  <script src="js/game.js?v=7"></script>
</body>
</html>
